
name: Build ShortDrama APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install project dependencies
        run: bun install --frozen-lockfile

      - name: Build web application
        run: bun run build

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Java installation
        run: |
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"
          test "$(javac -version 2>&1 | grep -o '21' | head -1)" = "21"

      - name: Install Capacitor
        run: |
          bun add @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Configure Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.shortdrama.app",
            "appName": "ShortDrama",
            "webDir": "dist"
          }
          EOF

      - name: Create Android project
        run: |
          bunx cap add android
          bunx cap sync android

      - name: Build APK with Java 21
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --stop
          ./gradlew --version
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShortDrama-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
