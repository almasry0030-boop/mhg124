<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (full bleed, no corner radius) -->
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1C29" />
      <stop offset="50%" stop-color="#0E0F17" />
      <stop offset="100%" stop-color="#07080B" />
    </linearGradient>

    <!-- Brand Flame Gradient -->
    <linearGradient id="flameGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A55" />
      <stop offset="50%" stop-color="#FF4E3E" />
      <stop offset="100%" stop-color="#FF7A00" />
    </linearGradient>

    <!-- Inner Glow Gradient -->
    <linearGradient id="playGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFE8EC" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadowMask" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#FF2A55" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full Bleed Background for Android Masking -->
  <rect width="512" height="512" fill="url(#bgGradMask)" />

  <!-- Safe Zone Graphic (Scale to within central 75% safe area) -->
  <g transform="translate(64, 64) scale(0.75)">
    <!-- Ambient Glow Behind Icon -->
    <circle cx="256" cy="256" r="140" fill="#FF2A55" opacity="0.25" />

    <!-- Shield / Emblem Container -->
    <rect x="106" y="106" width="300" height="300" rx="68" fill="url(#flameGradMask)" filter="url(#shadowMask)" />

    <!-- Inner Dark Accent Plate -->
    <rect x="122" y="122" width="268" height="268" rx="54" fill="#0E0F17" opacity="0.15" />

    <!-- Play Symbol (Rounded Cinema Triangle) -->
    <path d="M 220 186 C 220 174 233 166 244 172 L 340 236 C 350 243 350 259 340 266 L 244 330 C 233 336 220 328 220 316 Z" 
          fill="url(#playGradMask)" />

    <!-- Cinematic Film Perforations & Accent Dots -->
    <circle cx="166" cy="180" r="10" fill="#FFFFFF" opacity="0.9" />
    <circle cx="166" cy="256" r="10" fill="#FFFFFF" opacity="0.9" />
    <circle cx="166" cy="332" r="10" fill="#FFFFFF" opacity="0.9" />

    <!-- Drama Sparks -->
    <path d="M 372 152 L 377 165 L 390 170 L 377 175 L 372 188 L 367 175 L 354 170 L 367 165 Z" fill="#FFE27A" opacity="0.95" />
  </g>
</svg>
