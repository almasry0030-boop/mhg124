<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1C29" />
      <stop offset="50%" stop-color="#0E0F17" />
      <stop offset="100%" stop-color="#07080B" />
    </linearGradient>

    <!-- Brand Flame Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A55" />
      <stop offset="50%" stop-color="#FF4E3E" />
      <stop offset="100%" stop-color="#FF7A00" />
    </linearGradient>

    <!-- Inner Glow Gradient -->
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFE8EC" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#FF2A55" flood-opacity="0.45" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="url(#flameGrad)" stroke-width="3" stroke-opacity="0.35" />

  <!-- Ambient Glow Behind Icon -->
  <circle cx="256" cy="256" r="140" fill="#FF2A55" opacity="0.18" filter="blur(30px)" />

  <!-- Shield / Emblem Container -->
  <rect x="106" y="106" width="300" height="300" rx="68" fill="url(#flameGrad)" filter="url(#shadow)" />

  <!-- Inner Dark Accent Plate -->
  <rect x="122" y="122" width="268" height="268" rx="54" fill="#0E0F17" opacity="0.15" />

  <!-- Play Symbol (Rounded Cinema Triangle) -->
  <path d="M 220 186 C 220 174 233 166 244 172 L 340 236 C 350 243 350 259 340 266 L 244 330 C 233 336 220 328 220 316 Z" 
        fill="url(#playGrad)" 
        filter="url(#softShadow)" />

  <!-- Cinematic Film Perforations & Accent Dots -->
  <circle cx="166" cy="180" r="10" fill="#FFFFFF" opacity="0.9" />
  <circle cx="166" cy="256" r="10" fill="#FFFFFF" opacity="0.9" />
  <circle cx="166" cy="332" r="10" fill="#FFFFFF" opacity="0.9" />

  <!-- Drama Sparks -->
  <path d="M 372 152 L 377 165 L 390 170 L 377 175 L 372 188 L 367 175 L 354 170 L 367 165 Z" fill="#FFE27A" opacity="0.95" />
</svg>
